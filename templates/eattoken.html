<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FreeFire · EAT to Access Token</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .spinner {
            border: 4px solid rgba(255, 170, 51, 0.3);
            border-radius: 50%;
            border-top: 4px solid #ffaa33;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-badge {
            background: #00aa00;
            border-radius: 30px;
            padding: 6px 20px;
            color: white;
            font-weight: bold;
        }
        .btn-secondary {
            background: #2a3344;
            border: 2px solid #ff8800;
            border-radius: 40px;
            padding: 14px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: 0.1s;
        }
        .btn-secondary:hover {
            background: #3a4455;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🍽️ EAT → ACCESS TOKEN</h2>
        <div class="sub">enter your EAT token & fetch real data</div>

        <div class="eat-section" style="background: #161d32;">
            <div class="label"><span>🔑 EAT token</span></div>
            <input type="text" id="eatInput" class="field" placeholder="Enter your EAT token here...">

            <div style="margin: 28px 0 8px;">
                <button class="btn-primary" id="proceedEatBtn" style="font-size: 1.2rem; padding: 16px;">🚀 PROCEED & FETCH</button>
            </div>
            
            <!-- Manual URL input section -->
            <div style="margin: 20px 0; text-align: center;">
                <span style="color: #ffaa33;">——— OR ———</span>
            </div>
            
            <div class="label"><span>🔗 Full Ticket URL</span></div>
            <input type="text" id="ticketUrlInput" class="field" placeholder="Paste full ticket URL...">
            <button class="btn-secondary" id="extractFromUrlBtn" style="margin-top: 12px;">🔍 Extract EAT from URL</button>
            
            <!-- Loading indicator -->
            <div id="loading" style="display: none; text-align: center; padding: 20px;">
                <div class="spinner"></div>
                <p style="color: #ffaa33;">Fetching data from API...</p>
            </div>
            
            <!-- Error message -->
            <div id="errorMsg" style="display: none; background: #330000; border: 1px solid #ff4444; border-radius: 30px; padding: 16px; color: #ff8888; margin-top: 16px;"></div>

            <p class="note">API: /api/fetch-eat?eat_token={token}</p>
        </div>

        <!-- Result area -->
        <div class="result-card" id="resultBox" style="display: none;">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 18px;">
                <span class="success-badge">✅ account data</span>
            </div>

            <div id="resultData"></div>
            <div id="creditLine" class="data-row" style="justify-content: center; color: #9dabdf;"></div>
            <div id="powerbyLine" class="data-row" style="justify-content: center;"></div>
        </div>

        <a href="/" class="back-link">⟵ back to main</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const proceedBtn = document.getElementById('proceedEatBtn');
            const extractBtn = document.getElementById('extractFromUrlBtn');
            const eatInput = document.getElementById('eatInput');
            const ticketUrlInput = document.getElementById('ticketUrlInput');
            const resultBox = document.getElementById('resultBox');
            const resultData = document.getElementById('resultData');
            const creditLine = document.getElementById('creditLine');
            const powerbyLine = document.getElementById('powerbyLine');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');

            // Check URL parameters on load
            function checkUrlParams() {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const eatParam = urlParams.get('eat');
                    
                    if (eatParam) {
                        eatInput.value = eatParam;
                        setTimeout(() => {
                            fetchEatToken(eatParam);
                        }, 500);
                    }
                } catch (e) {
                    console.log('URL param check failed:', e);
                }
            }

            // Extract EAT from full ticket URL
            function extractEatFromUrl() {
                const fullUrl = ticketUrlInput.value.trim();
                if (!fullUrl) {
                    showError('Please paste a ticket URL');
                    return;
                }
                
                try {
                    let eatToken = null;
                    
                    // Method 1: Try to extract from URL query parameters
                    const eatMatch = fullUrl.match(/[?&]eat=([^&]+)/);
                    if (eatMatch && eatMatch[1]) {
                        eatToken = eatMatch[1];
                    }
                    
                    // Method 2: If it's a long hex string
                    if (!eatToken && /^[a-f0-9]{100,}$/i.test(fullUrl)) {
                        eatToken = fullUrl;
                    }
                    
                    // Method 3: Try to find any long hex string
                    if (!eatToken) {
                        const hexMatch = fullUrl.match(/[a-f0-9]{100,}/i);
                        if (hexMatch) {
                            eatToken = hexMatch[0];
                        }
                    }
                    
                    if (eatToken) {
                        eatInput.value = eatToken;
                        fetchEatToken(eatToken);
                    } else {
                        showError('Could not extract EAT token from URL');
                    }
                } catch (e) {
                    showError('Error parsing URL: ' + e.message);
                }
            }

            // Main function to fetch EAT token via Flask backend
            async function fetchEatToken(token) {
                if (!token) {
                    showError('❌ Please enter an EAT token');
                    return;
                }

                resultBox.style.display = 'none';
                errorMsg.style.display = 'none';
                loading.style.display = 'block';
                
                try {
                    // Call our Flask backend
                    const response = await fetch(`/api/fetch-eat?eat_token=${encodeURIComponent(token)}`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    loading.style.display = 'none';
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('API Response:', data);
                    
                    if (data.status === 'error' || data.error) {
                        showError(data.message || data.error || 'Invalid EAT token or API error');
                        return;
                    }
                    
                    if (data.status === 'success' || data.account_id) {
                        renderApiResponse(data);
                        resultBox.style.display = 'block';
                    } else {
                        showError('Unexpected API response format');
                    }
                    
                } catch (error) {
                    loading.style.display = 'none';
                    showError('Error: ' + error.message);
                    console.error('API call failed:', error);
                }
            }

            extractBtn.addEventListener('click', extractEatFromUrl);

            proceedBtn.addEventListener('click', function() {
                fetchEatToken(eatInput.value.trim());
            });

            eatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    fetchEatToken(eatInput.value.trim());
                }
            });

            ticketUrlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    extractEatFromUrl();
                }
            });

            function showError(message) {
                errorMsg.innerHTML = `❌ ${message}`;
                errorMsg.style.display = 'block';
                resultBox.style.display = 'none';
                loading.style.display = 'none';
            }

            function renderApiResponse(data) {
                let html = '';
                
                const fields = [
                    {label: 'account_id', key: 'account_id'},
                    {label: 'account_nickname', key: 'account_nickname'},
                    {label: 'open_id', key: 'open_id'},
                    {label: 'access_token', key: 'access_token'},
                    {label: 'region', key: 'region'}
                ];

                fields.forEach(f => {
                    let value = data[f.key] || '—';
                    html += `<div class="data-row">
                        <span class="data-label">${f.label}</span>
                        <span class="data-value black-bg">${value} <button class="copy-btn white-stroke" data-copy="${value}">copy</button></span>
                    </div>`;
                });

                if (data.credit) {
                    creditLine.innerHTML = `<span class="data-label" style="color: #ffc285;">⭐ credit</span><span class="data-value black-bg">${data.credit}</span>`;
                } else {
                    creditLine.innerHTML = '';
                }
                
                if (data['Power By']) {
                    powerbyLine.innerHTML = `<span class="data-label" style="color: #ffc285;">⚡ power by</span><span class="data-value black-bg">${data['Power By']}</span>`;
                } else {
                    powerbyLine.innerHTML = '';
                }

                resultData.innerHTML = html;

                // Copy functionality
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        let textToCopy = this.getAttribute('data-copy');
                        let originalText = this.textContent;
                        
                        navigator.clipboard.writeText(textToCopy).then(() => {
                            this.textContent = 'copied!';
                            this.style.background = '#00aa00';
                            
                            setTimeout(() => {
                                this.textContent = originalText;
                                this.style.background = '#000000';
                            }, 1500);
                        }).catch(() => {
                            const textarea = document.createElement('textarea');
                            textarea.value = textToCopy;
                            document.body.appendChild(textarea);
                            textarea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textarea);
                            
                            this.textContent = 'copied!';
                            this.style.background = '#00aa00';
                            setTimeout(() => {
                                this.textContent = originalText;
                                this.style.background = '#000000';
                            }, 1500);
                        });
                    });
                });
            }

            checkUrlParams();
        });
    </script>
</body>
</html>
